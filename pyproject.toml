[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hesabe"
version = "1.1.0"
description = "Hesabe Payment Gateway SDK for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "cryptography>=42",
  "requests>=2.31",
]
authors = [{ name = "Saad Almajdi" }]
keywords = ["hesabe", "payment", "gateway", "knet", "kuwait", "mpgs", "apple-pay"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ruptyx/hesabe-python"
Repository = "https://github.com/ruptyx/hesabe-python"
Issues = "https://github.com/ruptyx/hesabe-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["hesabe"]

[tool.ruff]
line-length = 100
target-version = "py39"
